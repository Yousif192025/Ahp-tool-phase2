<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AMSESHI ADSS component diagram</title>
<desc>Three consumer layers (UI, Storage, Reporting) depend on the AMSESHI Framework, which depends on the AHP Decision Engine. The engine has no dependency on anything above it.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="55" y="60" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">UI layer</text>
<text x="140" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Forms &amp; tables</text>

<rect x="245" y="60" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Storage layer</text>
<text x="330" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Local + JSON files</text>

<rect x="435" y="60" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="520" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Reporting layer</text>
<text x="520" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Export &amp; citations</text>

<line x1="140" y1="116" x2="270" y2="180" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="116" x2="340" y2="180" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520" y1="116" x2="410" y2="180" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="180" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">AMSESHI framework</text>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Orchestrates assessment</text>

<line x1="340" y1="236" x2="340" y2="300" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="240" y="300" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="320" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">AHP decision engine</text>
<text x="340" y="338" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Generic matrix engine</text>
</svg>
