<svg width="680" height="720" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Module dependency diagram, before and after</title>
<desc>Before: index.html is a single inline script where UI, calculation, chart, and export code all read and write each other directly. After: a layered structure where UI, storage, and reporting depend only on the AMSESHI framework, which alone depends on the AHP engine.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="340" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Before — current state</text>
<rect x="60" y="70" width="560" height="210" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">index.html — one inline script, ~3700 lines</text>

<rect x="100" y="110" width="150" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="175" y="135" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">UI code</text>
<rect x="430" y="110" width="150" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="505" y="135" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Chart code</text>
<rect x="100" y="180" width="150" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="175" y="205" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Calculation code</text>
<rect x="430" y="180" width="150" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="505" y="205" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Export code</text>

<line x1="175" y1="135" x2="505" y2="135" stroke="#D85A30" stroke-width="1" opacity="0.5"/>
<line x1="175" y1="135" x2="175" y2="205" stroke="#D85A30" stroke-width="1" opacity="0.5"/>
<line x1="175" y1="135" x2="505" y2="205" stroke="#D85A30" stroke-width="1" opacity="0.5"/>
<line x1="505" y1="135" x2="175" y2="205" stroke="#D85A30" stroke-width="1" opacity="0.5"/>
<line x1="505" y1="135" x2="505" y2="205" stroke="#D85A30" stroke-width="1" opacity="0.5"/>
<line x1="175" y1="205" x2="505" y2="205" stroke="#D85A30" stroke-width="1" opacity="0.5"/>

<text x="340" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Every function reads and writes shared globals directly</text>

<text x="340" y="345" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">After — target state (Phase 3 onward)</text>

<rect x="55" y="380" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="400" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">UI layer</text>
<text x="140" y="418" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">js/ui/*.js</text>

<rect x="245" y="380" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="400" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Storage layer</text>
<text x="330" y="418" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">js/storage/*.js</text>

<rect x="435" y="380" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="520" y="400" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Reporting layer</text>
<text x="520" y="418" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">js/reporting/*.js</text>

<line x1="140" y1="436" x2="270" y2="500" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="436" x2="340" y2="500" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520" y1="436" x2="410" y2="500" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="500" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="520" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">AMSESHI framework</text>
<text x="340" y="538" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">js/frameworks/amseshi/</text>

<line x1="340" y1="556" x2="340" y2="620" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="240" y="620" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="640" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">AHP decision engine</text>
<text x="340" y="658" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">js/core/ahp-engine.js</text>
</svg>
