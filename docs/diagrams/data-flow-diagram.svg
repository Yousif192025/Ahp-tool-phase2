<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AMSESHI assessment data flow</title>
<desc>User input flows into the AMSESHI framework, which builds matrices and calls the AHP engine to compute priority vectors and consistency ratios. AMSESHI then assembles the result with metadata and fans it out to the UI, storage, and reporting layers.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="230" y="60" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User input</text>
<text x="340" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Pairwise comparisons</text>
<line x1="340" y1="116" x2="340" y2="140" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="140" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">AMSESHI framework</text>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Builds matrices</text>
<line x1="340" y1="196" x2="340" y2="220" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="220" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">AHP engine</text>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Priority vectors + CR</text>
<line x1="340" y1="276" x2="340" y2="300" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="300" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="320" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">AMSESHI framework</text>
<text x="340" y="338" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Assembles result</text>

<line x1="340" y1="356" x2="140" y2="420" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="356" x2="340" y2="420" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="356" x2="520" y2="420" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="55" y="420" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">UI display</text>
<text x="140" y="458" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Show results</text>

<rect x="245" y="420" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Storage</text>
<text x="330" y="458" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Save assessment</text>

<rect x="435" y="420" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="520" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Reporting</text>
<text x="520" y="458" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Export &amp; citation</text>
</svg>
